[package]
name = "schrodinger-plugin-attachment"
version = "0.2.0"
edition = "2021"
description = "Paste-as-file (attachment) derivation plugin for Schrödinger"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
schrodinger-plugin-sdk = { git = "https://github.com/georgemandis/schrodinger-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
