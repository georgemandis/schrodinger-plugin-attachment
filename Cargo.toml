[package]
name = "schrodinger-plugin-attachment"
version = "0.1.0"
edition = "2021"
description = "Paste-as-file (attachment) derivation plugin for Schrödinger"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
schrodinger-plugin-sdk = { git = "https://github.com/georgemandis/schrodinger-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
